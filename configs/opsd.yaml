# OPSD baseline (on-policy self-distillation with the rubric as the teacher's
# context, following RGSD).
#
# Hydra override list for `python -m verl.trainer.main_ppo`. The frozen
# same-model teacher sees question + rubric through the OPSD teacher-loop
# context profile (../distill/rgsd_rubric_v1.yaml); the student is trained by
# clipped JSD distillation (no policy gradient, no task reward in the loss).
# The rubric judge scores validation only (score_train=false). Differences
# from the GRPO arms: 1 rollout/prompt, batch 128, lr 4.2e-6, response 2048,
# 485 steps, reinforce++ advantage estimator with rollout correction bypassed.
# Needs the OPSD engine extensions described in ../distill/README.md.
#
# Required environment (see configs/README.md):
#   PRORUBRIC_MODEL_PATH           base model (Qwen3-4B or Qwen3-8B)
#   PRORUBRIC_TRAIN_PARQUET        the atomic-rubric parquet with extra_info.opsd_context_kind set
#   PRORUBRIC_VAL_HELDOUT_PARQUET  held-out validation parquet (the atomic arm's, for every arm)
#   PRORUBRIC_VAL_BENCH_PARQUET    benchmark validation parquet (medicine: HealthBench held-out)
#   PRORUBRIC_OUTPUT_DIR           writable output directory
#   RUBRIC_JUDGE_TRAIN_* / RUBRIC_JUDGE_VAL_* (or the shared RUBRIC_JUDGE_*)
#                                  training-reward and validation judges; see ../reward/judge_client.py
# Run with reward/ on PYTHONPATH so `pkg://rubric_judge` resolves.
- data.return_raw_chat=True
- ++data.prompt_template_mode=chat   # "++" sets-or-appends: upstream verl v0.8.0 has no such key (chat is its only behaviour), the OPSD engine does
- +data.apply_chat_template_kwargs.enable_thinking=False
- data.train_batch_size=128
- data.max_prompt_length=4096
- data.max_response_length=2048
- data.filter_overlong_prompts=True
- data.truncation=error
- actor_rollout_ref.model.path=${oc.env:PRORUBRIC_MODEL_PATH}
- actor_rollout_ref.model.use_fused_kernels=False
- actor_rollout_ref.model.use_remove_padding=True
- actor_rollout_ref.model.enable_gradient_checkpointing=True
- actor_rollout_ref.actor.ppo_mini_batch_size=32
- actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
- actor_rollout_ref.actor.ppo_epochs=1
- actor_rollout_ref.actor.use_dynamic_bsz=True
- actor_rollout_ref.actor.use_kl_loss=False
- actor_rollout_ref.actor.optim.clip_grad=0.1
- actor_rollout_ref.actor.optim.lr=4.2e-6
- actor_rollout_ref.actor.optim.lr_scheduler_type=constant
- actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.1
- actor_rollout_ref.rollout.name=vllm
- actor_rollout_ref.rollout.n=1
- actor_rollout_ref.rollout.temperature=1.0
- actor_rollout_ref.rollout.top_p=1.0
- actor_rollout_ref.rollout.top_k=-1
- actor_rollout_ref.rollout.tensor_model_parallel_size=1
- actor_rollout_ref.rollout.gpu_memory_utilization=0.35
- actor_rollout_ref.rollout.max_model_len=10240
- actor_rollout_ref.rollout.max_num_batched_tokens=12288
- actor_rollout_ref.rollout.calculate_log_probs=True
- actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
- actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
- algorithm.adv_estimator=reinforce_plus_plus
- algorithm.use_kl_in_reward=False
- algorithm.rollout_correction.bypass_mode=True
- algorithm.rollout_correction.loss_type=ppo_clip
- critic.enable=False
- reward.reward_manager.source=importlib
- reward.reward_manager.name=RubricJudgeRewardManager
- reward.reward_manager.module.path=pkg://rubric_judge
- reward.num_workers=1
- +reward.reward_kwargs.score_train=False
- +reward.rubric_judge.qpm=${oc.env:RUBRIC_JUDGE_QPM,25}
- +reward.rubric_judge.tpm=${oc.env:RUBRIC_JUDGE_TPM,250000}
- +reward.rubric_judge.max_concurrency=${oc.env:RUBRIC_JUDGE_MAX_CONCURRENCY,64}
- +reward.rubric_judge.val_thinking=${oc.env:RUBRIC_JUDGE_VAL_THINKING,disabled}
- trainer.n_gpus_per_node=8
- trainer.nnodes=1
- trainer.total_epochs=5
- trainer.total_training_steps=485
- trainer.save_freq=50
- trainer.test_freq=50
- trainer.val_before_train=True
- trainer.default_local_dir=${oc.env:PRORUBRIC_OUTPUT_DIR}/checkpoints
- distillation.enabled=True
- distillation.enable_resource_pool=False
- distillation.n_gpus_per_node=8
- distillation.nnodes=1
- distillation.opsd.enable=True
- distillation.opsd.require_same_model=True
- distillation.opsd.teacher_thinking=False
- distillation.opsd.context_profile_path=${oc.env:PRORUBRIC_CONTEXT_PROFILE,../distill/rgsd_rubric_v1.yaml}
- distillation.opsd.model_identity=${oc.env:PRORUBRIC_MODEL_PATH}
- distillation.teacher_models.teacher_model.model_path=${oc.env:PRORUBRIC_MODEL_PATH}
- distillation.teacher_models.teacher_model.model_identity=${oc.env:PRORUBRIC_MODEL_PATH}
- distillation.teacher_models.teacher_model.inference.name=vllm
- distillation.teacher_models.teacher_model.inference.gpu_memory_utilization=0.25
- distillation.teacher_models.teacher_model.inference.temperature=1.0
- distillation.teacher_models.teacher_model.inference.tensor_model_parallel_size=1
- distillation.teacher_models.teacher_model.inference.max_model_len=10240
- distillation.teacher_models.teacher_model.inference.max_num_batched_tokens=12288
- distillation.teacher_models.teacher_model.inference.prompt_length=6144
- distillation.teacher_models.teacher_model.inference.response_length=2048
- distillation.distillation_loss.loss_mode=opsd
- distillation.distillation_loss.opsd_vocab_support=student_teacher_union
- distillation.distillation_loss.opsd_objective=jsd
- distillation.distillation_loss.opsd_jsd_beta=0.5
- distillation.distillation_loss.opsd_jsd_token_clip=0.05
- distillation.distillation_loss.topk=128
- distillation.distillation_loss.use_task_rewards=False
- distillation.distillation_loss.use_policy_gradient=False
- distillation.distillation_loss.kd_temperature=1.0
- actor_rollout_ref.rollout.prompt_length=4096
- trainer.max_actor_ckpt_to_keep=2
- trainer.project_name=prorubric
- trainer.experiment_name=opsd
- 'trainer.logger=["console","file","tensorboard"]'
- data.seed=42
- data.train_files=${oc.env:PRORUBRIC_TRAIN_PARQUET}
- "data.val_files=['${oc.env:PRORUBRIC_VAL_HELDOUT_PARQUET}','${oc.env:PRORUBRIC_VAL_BENCH_PARQUET}']"
- data.prompt_key=prompt
- actor_rollout_ref.rollout.val_kwargs.n=1
- hydra.run.dir=/tmp/hydra/opsd
- +reward.rubric_judge.score_train=${oc.env:RUBRIC_JUDGE_SCORE_TRAIN,false}
- +reward.rubric_judge.train_thinking=${oc.env:RUBRIC_JUDGE_TRAIN_THINKING,disabled}
- +reward.rubric_judge.train_max_tokens=${oc.env:RUBRIC_JUDGE_TRAIN_MAX_TOKENS,1024}
- +reward.rubric_judge.dry_run_fake_judge=${oc.env:RUBRIC_JUDGE_DRY_RUN_FAKE,false}
